<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f5f5f5;
        }

        nav ul {
            display: flex;
            gap: 20px; 
        }

        nav li {
            list-style: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #0077cc;
        }

        nav button {
            background-color: #0077cc;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
        }

        nav button a {
            color: white;
            font-weight: 600;
        }

        nav button:hover {
            background-color: #005fa3;
        }

        .hero-section {
            position: relative;
            z-index: 2;
        }

        .heading p {
            width: 20%;
            background-color: rgb(169, 175, 242);
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            padding: 10px 20px;
            margin-top: 3%;
            margin-left: 3%;
            border-radius: 25px;
        }

        .Sub-heading p {
            width: 50%;
            font-size: 50px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: left;
            padding: 10px 20px;
            margin-top: 3%;
            margin-left: 2%;
        }

        .Hero-Text p {
            width: 50%;
            font-size: 20px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: left;
            padding: 10px 20px;
            margin-top: 3%;
            margin-left: 2%;
        }

        .search-box input {
            width: 50%;
            font-size: 20px;
            text-align: left;
            padding: 10px 20px;
            margin-top: 3%;
            margin-left: 2%;
            border-radius: 25px;
            background-color: lightblue;
            border: none;
            outline: none;
        }

        .dna{
  transform: rotate(30deg);
  position: absolute;
  top:4%;
  left: 25%;
  margin-right: 0;
  /* padding-left: 50%; */
  /* background-color: red; */
  height: 100vh;
  width: 100vw;
}

.strain{
  width: 555px;
  height: 5px;
  background-color: #dbdbdb;
  /* background-color: red; */
  position: relative;
  margin: 83px auto;
  /* margin-top: 28px; */
  margin-bottom: 28px;
  -webkit-animation-name: rotate-strain;
  animation-name: rotate-strain;
  -webkit-animation-duration: 1.7s;
  animation-duration: 1.7s;
  -webkit-animation-timing-function: linear;
  animation-timing-function: linear;
  -webkit-animation-iteration-count: infinite;
  animation-iteration-count: infinite;
  -webkit-animation-play-state: running;
  animation-play-state: running;
}

.strain:before{
  content: "";
  display: block;
  position: absolute;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background-color: #13b6e2;
  /* background-color: orange; */
  left: 0;
  /* margin-top: -9px; */
  margin-left: -9px;
  -webkit-animation-name: strain-size-left;
  animation-name: train-size-left;
  -webkit-animation-duration: 1.7s;
  animation-duration: 1.7s;
  -webkit-animation-timing-function: linear;
  animation-timing-function: linear;
  -webkit-animation-iteration-count: infinite;
  animation-iteration-count: infinite;
  -webkit-animation-play-state: running;
  animation-play-state: running;
}

.strain:after{
  content: "";
  display: block;
  position: absolute;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background-color: #13b6e2;
  /* background-color: green; */
  right: 0;
  /* margin-top: -9px; */
  margin-left: -9px;
  -webkit-animation-name: strain-size-right;
  animation-name: train-size-right;
  -webkit-animation-duration: 1.7s;
  animation-duration: 1.7s;
  -webkit-animation-timing-function: linear;
  animation-timing-function: linear;
  -webkit-animation-iteration-count: infinite;
  animation-iteration-count: infinite;
  -webkit-animation-play-state: running;
  animation-play-state: running;
}

.strain:nth-child(1),
.strain:nth-child(1):before,
.strain:nth-child(1):after {
    -webkit-animation-delay: 0.15s;
    animation-delay: 0.15s;
}

.strain:nth-child(2),
.strain:nth-child(2):before,
.strain:nth-child(2):after {
    -webkit-animation-delay: 0.3s;
    animation-delay: 0.3s;
}

.strain:nth-child(3),
.strain:nth-child(3):before,
.strain:nth-child(3):after {
    -webkit-animation-delay: 0.45s;
    animation-delay: 0.45s;
}

.strain:nth-child(4),
.strain:nth-child(4):before,
.strain:nth-child(4):after {
    -webkit-animation-delay: 0.6s;
    animation-delay: 0.6s;
}

.strain:nth-child(5),
.strain:nth-child(5):before,
.strain:nth-child(5):after {
    -webkit-animation-delay: 0.75s;
    animation-delay: 0.75s;
}

.strain:nth-child(6),
.strain:nth-child(6):before,
.strain:nth-child(6):after {
    -webkit-animation-delay: 0.9s;
    animation-delay: 0.9s;
}

@-webkit-keyframes rotate-strain{
  0%{
  width: 555px;
  }
  25%{
    width: 0;
  }
  50%{
  width: 555px;
  }
  75%{
    width: 0;
  }
  100%{
  width: 555px;
  }
}

@keyframes rotate-strain{
  0%{
  width: 555px;
  }
  25%{
    width: 0;
  }
  50%{
  width: 555px;
  }
  75%{
    width: 0;
  }
  100%{
  width: 555px;
  }
}

@-webkit-keyframes strain-size-left{
  0%{
    transform: scale(1) translateX(0px);
  }
  25%{
    transform: scale(0.5);
  }
  50%{
    transform: scale(1) translateX(155px);
  }
  75%{
    transform: scale(1.5);
  }
  100%{
    transform: scale(1) translateX(0px);
  }
}

@keyframes strain-size-left{
  0%{
    transform: scale(1) translateX(0px);
  }
  25%{
    transform: scale(0.5);
  }
  50%{
    transform: scale(1) translateX(155px);
  }
  75%{
    transform: scale(1.5);
  }
  100%{
    transform: scale(1) translateX(0px);
  }
}

@-webkit-keyframes strain-size-right{
  0%{
    transform: scale(1) translateX(0px);
  }
  25%{
    transform: scale(0.5);
  }
  50%{
    transform: scale(1) translateX(-155px);
  }
  75%{
    transform: scale(1.5);
  }
  100%{
    transform: scale(1) translateX(0px);
  }
}

@keyframes strain-size-right{
  0%{
    transform: scale(1) translateX(0px);
  }
  25%{
    transform: scale(0.5);
  }
  50%{
    transform: scale(1) translateX(-155px);
  }
  75%{
    transform: scale(1.5);
  }
  100%{
    transform: scale(1) translateX(0px);
  }
}

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
        }

        .row {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .col {
            flex: 1;
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .col:hover {
            transform: translateY(-5px);
        }

        .col img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: auto;
            margin-bottom: 10px;
        }

        .col figcaption {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            color: #333;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .Sub-heading p {
                font-size: 35px;
                width: 90%;
            }
            
            .Hero-Text p {
                width: 90%;
                font-size: 18px;
            }
            
            .search-box input {
                width: 90%;
            }
            
            .dna {
                display: none;
            }
            
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav>
            <img src="" alt="Logo" />
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Contact Us</a></li>
                <li><a href="">Account</a></li>
                <button><a href="">Book an appointment</a></button>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="heading">
            <p>Next-Gen Healthcare Software</p>
        </div>
        <div class="Sub-heading">
            <p>Smarter Hospital Management for Better Care</p>
        </div>
        <div class="Hero-Text">
            <p>
                Manage hospitals efficiently — from patient registration to advanced
                reporting — with seamless digital solutions.
            </p>
        </div>
        <div class="search-box">
            <input type="search" placeholder="Search healthcare solutions..." />
        </div>
    </div>

    <!-- DNA Animation -->
    <div class="dna">
        <div class="strain"></div>
        <div class="strain"></div>
        <div class="strain"></div>
        <div class="strain"></div>
        <div class="strain"></div>
        <div class="strain"></div>
    </div>

    <!-- Features Section -->
    <section class="container">
        <article class="row">
            <figure class="col">
                <i class="fas fa-user-md" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Patient Management</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-calendar-alt" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Appointment Scheduling</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-file-medical" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Medical Records</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-pills" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Pharmacy Management</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-chart-line" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Analytics & Reports</figcaption>
            </figure>
        </article>

        <article class="row">
            <figure class="col">
                <i class="fas fa-money-bill-wave" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Billing System</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-bed" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Bed Management</figcaption>
            </figure>
            <figure class="col">
                <i class="fas fa-shield-alt" style="font-size: 50px; color: #13b6e2; margin-bottom: 10px;"></i>
                <figcaption>Data Security</figcaption>
            </figure>
        </article>
    </section>
</body>
</html>
