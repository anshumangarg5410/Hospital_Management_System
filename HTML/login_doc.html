<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Forms</title>
    <link rel="stylesheet" href="../CSS/login_doc.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-container active" id="loginContainer">

            <!-- Welcome Section-->
            <div class="welcome-panel">
                <div class="welcome-content">
                    <h2>Hello, Welcome!</h2>
                    <a href="#">Don't have an account?</a>
                    <!-- <button class="switch-btn" onclick="switchToRegister()">Register</button> -->
                </div>
            </div>

            <!-- Login form section on the right side -->
            <div class="form-panel">
                <div class="form-content">
                    <h2>Login</h2>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="input-field">
                            <input type="text" name="username" placeholder="Doctor Id" required>
                            <i class="fas fa-user"></i>
                        </div>

                        <div class="input-field">
                            <input type="password" name="password" placeholder="Password" required>
                            <i class="fas fa-lock"></i>
                        </div>

                        <div class="forgot-link">
                            <a href="forgot password">Forgot Password?</a>
                        </div>

                        <!-- <button class="submit-button"><a href="../HTML/doctor_portal.html">Login</a></button> -->
                         <a href="../HTML/doctor_portal.html" class="submit-button">Login</a>

                    </form>
                </div>
            </div>

        </div>
        </div>
    </div>

    <!-- used js to switch the login and register pages -->
    <script>
        function switchToRegister() {
            document.getElementById("loginContainer").classList.remove("active");
            document.getElementById("registerContainer").classList.add("active");
        }

        function switchToLogin() {
            document.getElementById("registerContainer").classList.remove("active");
            document.getElementById("loginContainer").classList.add("active");
        }
    </script>
</body>

</html>
