<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Forms</title>
    <link rel="stylesheet" href="../CSS//login_pat.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-container active" id="loginContainer">

            <!-- Welcome Section-->
            <div class="welcome-panel main">
                <div class="welcome-content">
                    <h2>Hello, Welcome!</h2>
                    <a href="#">Don't have an account?</a>
                    <button class="switch-btn" onclick="switchToRegister()">Register</button>
                </div>
            </div>

            <!-- Login form section on the right side -->
            <div class="form-panel">
                <div class="form-content">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="input-field">
                            <input id="" type="text" name="username" placeholder="Username" required>
                            <i class="fas fa-user"></i>
                        </div>

                        <div class="input-field">
                            <input id="" type="password" name="password" placeholder="Password" required>
                            <i class="fas fa-lock"></i>
                        </div>

                        <div class="forgot-link">
                            <a href="forgot password">Forgot Password?</a>
                        </div>

                        <a href="../" id="login_as_patient_btn" class="submit-button ">Login</a>


                        <div class="social-login">
                            <p>or login with social platforms</p>
                            <div class="social-icons">
                                <button type="button" class="social-btn google">
                                    <i class="fab fa-google"></i>
                                </button>
                                <button type="button" class="social-btn facebook">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button type="button" class="social-btn github">
                                    <i class="fab fa-github"></i>
                                </button>
                                <button type="button" class="social-btn linkedin">
                                    <i class="fab fa-linkedin-in"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Registration Form -->
        <div class="form-container" id="registerContainer">

            <!-- Registration form to be on left side-->
            <div class="form-panel">
                <div class="form-content">
                    <h2>Registration</h2>
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="input-field">
                            <input type="text" name="username" placeholder="Username" required>
                            <i class="fas fa-user"></i>
                        </div>

                        <div class="input-field">
                            <input type="email" id="patient_register_email" name="email" placeholder="Email" required>
                            <i class="fas fa-envelope"></i>
                        </div>

                        <div class="input-field">
                            <input type="password" name="password" placeholder="Password" required>
                            <i class="fas fa-lock"></i>
                        </div>

                        <button type="submit" class="submit-button">Register</button>

                        <div class="social-login">
                            <p>or register with social platforms</p>
                            <div class="social-icons">
                                <button type="button" class="social-btn google">
                                    <i class="fab fa-google"></i>
                                </button>
                                <button type="button" class="social-btn facebook">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button type="button" class="social-btn github">
                                    <i class="fab fa-github"></i>
                                </button>
                                <button type="button" class="social-btn linkedin">
                                    <i class="fab fa-linkedin-in"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Welcome Back Section on the right side for registration -->
            <div class="welcome-panel">
                <div class="welcome-content">
                    <h2>Welcome Back!</h2>
                    <a href="#">Already have an account?</a>
                    <a href="../index.html" class="submit-button">Login</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../JS/main.js"></script>
    <script src="../JS/patient_login.js"></script>
    <script>
        window.onload = () => {
            if (localStorage.getItem("openRegister") === "true") {
                localStorage.removeItem("openRegister"); // clear flag
                // your existing function that switches to register
                switchToRegisterForm();
            }
        };
    </script>

</body>

</html>
