<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - Doctor Login</title>
    <link rel="stylesheet" href="../CSS/doctor_login.css">
    		<link rel="icon" type="image/png" href="./Assets/mainlogo.png" />
</head>
<body>
    <main>
        <header>
            <figure class="logo">👨‍⚕️</figure>
            <h1>Doctor Login</h1>
            <p class="subtitle">Welcome back, Doctor</p>
            <span class="user-type">Medical Professional</span>
        </header>

        <form>
            <label>
                <span>Doctor ID</span>
                <input type="text" placeholder="Enter your doctor ID" required>
            </label>
            
            <label>
                <span>Password</span>
                <input type="password" placeholder="Enter your password" required>
            </label>
            
            <a href="../HTML/doctor_portal.html">
                <button type="button">Sign In</button>
            </a>
        </form>

        <section class="forgot-password">
            <a href="#">Forgot Password?</a>
        </section>

        <footer class="back-link">
            <a href="index.html">← Back to User Selection</a>
        </footer>
    </main>
</body>
</html>
