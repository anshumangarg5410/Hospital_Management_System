<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - Patient Login</title>
    <link rel="stylesheet" href="../CSS/patient_login.css">
    		<link rel="icon" type="image/png" href="../Assets/mainlogo.png" />
</head>
<body>
    <main>
        <header>
            <figure class="logo">👤</figure>
            <h1>Patient Access</h1>
            <p class="subtitle">Sign in or create your account</p>
            <span class="user-type">Patient Portal</span>
        </header>

        <nav class="form-toggle">
            <button class="toggle-btn active" onclick="showLogin()">Sign In</button>
            <button class="toggle-btn" onclick="showRegister()">Register</button>
        </nav>

        <!-- Login Form -->
        <section class="form-section active" id="login-form">
            <form>
                <label>
                    <span>Email Address</span>
                    <input type="email" placeholder="Enter your email" required>
                </label>
                
                <label>
                    <span>Password</span>
                    <input type="password" placeholder="Enter your password" required>
                </label>
                
                <a href="../HTML/patient_dash.html">
    <button type="button">Sign In</button>
</a>
            </form>

            <section class="forgot-password">
                <a href="#">Forgot Password?</a>
            </section>
        </section>

        <!-- Register Form -->
        <section class="form-section" id="register-form">
            <form>
                <label>
                    <span>Full Name</span>
                    <input type="text" placeholder="Enter your full name" required>
                </label>
                
                <label>
                    <span>Email Address</span>
                    <input type="email" placeholder="Enter your email" required>
                </label>
                
                <label>
                    <span>Phone Number</span>
                    <input type="tel" placeholder="Enter your phone number" required>
                </label>
                
                <label>
                    <span>Password</span>
                    <input type="password" placeholder="Create a password" required>
                </label>
                
                <label>
                    <span>Confirm Password</span>
                    <input type="password" placeholder="Confirm your password" required>
                </label>
                
                <a href="../HTML/patient_login.html">
    <button type="button">Create Account</button>
</a>
                
            </form>
        </section>

        <footer class="back-link">
            <a href="index.html">← Back to User Selection</a>
        </footer>
    </main>

    <script>
        function showLogin() {
            document.querySelector('.toggle-btn.active').classList.remove('active');
            event.target.classList.add('active');
            document.querySelector('.form-section.active').classList.remove('active');
            document.getElementById('login-form').classList.add('active');
        }

        function showRegister() {
            document.querySelector('.toggle-btn.active').classList.remove('active');
            event.target.classList.add('active');
            document.querySelector('.form-section.active').classList.remove('active');
            document.getElementById('register-form').classList.add('active');
        }
    </script>
</body>
</html>
