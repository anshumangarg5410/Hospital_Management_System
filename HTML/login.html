<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>HMS - Hospital Management System</title>
	<link rel="stylesheet" href="../CSS/login.css">
			<link rel="icon" type="image/png" href="./Assets/mainlogo.png" />
</head>
<body>
	<main class="container">
		
		<!-- Left Side -->
		<section class="left-section">
			<figure class="logo">
				<svg viewBox="0 0 24 24">
					<path d="M12,2C13.1,2 14,2.9 14,4C14,5.1 13.1,6 12,6C10.9,6 10,5.1 10,4C10,2.9 10.9,2 12,2M21,9V7L15,1H5C3.89,1 3,1.89 3,3V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V9M12,15C13.66,15 15,13.66 15,12C15,10.34 13.66,9 12,9C10.34,9 9,10.34 9,12C9,13.66 10.34,15 12,15Z"/>
				</svg>
			</figure>
			<h1>Hospital Management System</h1>
			<p>
				Streamlining healthcare operations with advanced digital solutions for
				better patient care and efficient medical administration.
			</p>
		</section>

		<!-- Right Side -->
		<section class="right-section">
			<header class="form-header">
				<h2>Welcome Back</h2>
				<p>Please sign in to your account</p>
			</header>

			<nav class="user-type-selector">
				<button class="user-type-btn active" onclick="switchUserType('doctor')">👨‍⚕️ Doctor</button>
				<button class="user-type-btn" onclick="switchUserType('patient')">🏥 Patient</button>
			</nav>

			<!-- Forms -->
			<section class="form-container">

				<!-- Doctor Login -->
				<form class="form active" id="doctor-form">
					<label class="form-group">
						<span>Doctor ID</span>
						<input type="text" id="doctor-id" name="doctor-id" placeholder="Enter your doctor ID" required />
					</label>
					<label class="form-group">
						<span>Password</span>
						<input type="password" id="doctor-password" name="password" placeholder="Enter your password" required />
					</label>
					<button type="submit" class="submit-btn">Sign In as Doctor</button>
					<footer class="form-footer"><a href="#">Forgot Password?</a></footer>
				</form>

				<!-- Patient Login -->
				<form class="form" id="patient-login-form">
					<label class="form-group">
						<span>Email Address</span>
						<input type="email" id="patient-email" name="email" placeholder="Enter your email" required />
					</label>
					<label class="form-group">
						<span>Password</span>
						<input type="password" id="patient-password" name="password" placeholder="Enter your password" required />
					</label>
					<button type="submit" class="submit-btn">Sign In as Patient</button>
					<footer class="form-footer"><a href="#">Forgot Password?</a></footer>
					<div class="register-toggle">
						<p>Don't have an account?</p>
						<button type="button" onclick="showPatientRegister()">Create Account</button>
					</div>
				</form>

				<!-- Patient Registration -->
				<form class="form" id="patient-register-form">
					<label class="form-group">
						<span>Full Name</span>
						<input type="text" id="reg-name" name="name" placeholder="Enter your full name" required />
					</label>
					<label class="form-group">
						<span>Email Address</span>
						<input type="email" id="reg-email" name="email" placeholder="Enter your email" required />
					</label>
					<label class="form-group">
						<span>Phone Number</span>
						<input type="tel" id="reg-phone" name="phone" placeholder="Enter your phone number" required />
					</label>
					<label class="form-group">
						<span>Password</span>
						<input type="password" id="reg-password" name="password" placeholder="Create a password" required />
					</label>
					<label class="form-group">
						<span>Confirm Password</span>
						<input type="password" id="reg-confirm-password" name="confirm-password" placeholder="Confirm your password" required />
					</label>
					<button type="submit" class="submit-btn">Create Account</button>
					<div class="register-toggle">
						<p>Already have an account?</p>
						<button type="button" onclick="showPatientLogin()">Sign In</button>
					</div>
				</form>

			</section>
		</section>
	</main>

	<script>
		function switchUserType(type) {
			document.querySelectorAll(".user-type-btn").forEach((btn) => btn.classList.remove("active"));
			event.target.classList.add("active");
			document.querySelectorAll(".form").forEach((form) => form.classList.remove("active"));
			if (type === "doctor") {
				document.getElementById("doctor-form").classList.add("active");
			} else {
				document.getElementById("patient-login-form").classList.add("active");
			}
		}
		function showPatientRegister() {
			document.querySelectorAll(".form").forEach((form) => form.classList.remove("active"));
			document.getElementById("patient-register-form").classList.add("active");
		}
		function showPatientLogin() {
			document.querySelectorAll(".form").forEach((form) => form.classList.remove("active"));
			document.getElementById("patient-login-form").classList.add("active");
		}
	</script>
</body>
</html>
