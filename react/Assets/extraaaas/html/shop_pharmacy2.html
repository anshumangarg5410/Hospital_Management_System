<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS Product Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/shop_pharmacy.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="#" class="logo">
          <div class="logo_pic"></div>
          <span>HMS</span>
        </a>

        <ul class="nav-links">
          <li class="here"><a href="#home">Home</a></li>
          <li class="here"><a href="./HTML/about.html">About</a></li>
          <li class="here"><a href="./HTML/contactpage.html">Contact</a></li>
          <li class="here" id="authSection">
            <a href="./HTML/user_sel.html" id="authLink">Login</a>
          </li>

          <li class="user-dropdown" id="userDropdown" style="display: none">
            <div class="user-profile-nav">
              <div class="user-avatar-small" id="navUserAvatar">U</div>
              <span id="navUserName">User</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
              <a href="./HTML/user_portal.html" class="dropdown-item">
                <i class="fas fa-user-circle"></i> My Portal
              </a>
              <a
                href="./HTML/user_portal.html?tab=appointments"
                class="dropdown-item"
              >
                <i class="fas fa-calendar-check"></i> Appointments
              </a>
              <a
                href="./HTML/user_portal.html?tab=prescriptions"
                class="dropdown-item"
              >
                <i class="fas fa-prescription"></i> Prescriptions
              </a>
              <a
                href="./HTML/user_portal.html?tab=profile"
                class="dropdown-item"
              >
                <i class="fas fa-cog"></i> Settings
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </div>
          </li>
        </ul>

        <button class="mobile-menu">
          <i class="fas fa-bars"></i>
        </button>
      </nav>
    </header>

    <section class="banner">
      <div class="banner-content">
        <h2>Grab Upto 50% Off On Selected Medicines</h2>
        <button>Buy Now</button>
      </div>
    </section>

    <div class="page-container">
      <aside class="sidebar">
        <div class="filter-group">
          <h3>EXPLORE CATEGORIES</h3>
          <ul id="categoryFilters">
            <li>
              <input type="checkbox" id="cat1" value="Vitamins & Selfcare" />
              <label for="cat1">Vitamins & Selfcare</label>
            </li>
            <li>
              <input type="checkbox" id="cat2" value="Immunity & Support" />
              <label for="cat2">Immunity & Support</label>
            </li>
            <li>
              <input type="checkbox" id="cat3" value="Digestive Health" />
              <label for="cat3">Digestive Health</label>
            </li>
            <li>
              <input type="checkbox" id="cat4" value="Pain Relief" />
              <label for="cat4">Pain Relief</label>
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h3>HEALTH CONDITION</h3>
          <ul id="conditionFilters">
            <li>
              <input type="checkbox" id="con1" value="Allergy & Hayfever" />
              <label for="con1">Allergy & Hayfever</label>
            </li>
            <li>
              <input type="checkbox" id="con2" value="Cough & Cold" />
              <label for="con2">Cough & Cold</label>
            </li>
            <li>
              <input type="checkbox" id="con3" value="First Aid" />
              <label for="con3">First Aid</label>
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h3>PRICE RANGE</h3>
          <ul id="priceFilters">
            <li>
              <input type="checkbox" id="p1" value="0-10" />
              <label for="p1">$0 - $10</label>
            </li>
            <li>
              <input type="checkbox" id="p2" value="10-20" />
              <label for="p2">$10 - $20</label>
            </li>
            <li>
              <input type="checkbox" id="p3" value="20-999" />
              <label for="p3">$20+</label>
            </li>
          </ul>
        </div>

        <button class="clear-filters-btn" id="clearFilters">Clear All</button>
      </aside>

      <main class="product-content">
        <div class="product-grid" id="productGrid">
          <div class="loading">Loading medicines...</div>
        </div>
      </main>
    </div>

    <script src="../JS/pharmacy.js"></script>
    <script src="../JS/navbar.js"></script>
  </body>
</html>
